version: '3.8'

# ==============================================================================
# SAMANVAY (SIH PS 26264) — Production Docker Compose Topology
#
# Multi-Tier Container Architecture:
# 1. proxy: Nginx TLS reverse-proxy with rate-limiting, SSL termination, and security headers
# 2. frontend: Production SPA static asset container (Nginx + Vite build)
# 3. backend: FastAPI enterprise ASGI application running on Gunicorn + Uvicorn workers
# 4. worker: Supervised background scheduler for SLA escalations and alert dispatch
# 5. postgres: PostgreSQL 16 relational database (No exposed host ports, internal network only)
#
# Security Controls:
# - Zero host exposure for database port (5432) and backend port (8000).
# - Only ports 80 (HTTP redirect) and 443 (HTTPS) are exposed on host.
# - Isolated bridge network (samanvay-network).
# - Non-root execution in application containers.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Edge Secure TLS Reverse Proxy
  # ----------------------------------------------------------------------------
  proxy:
    image: nginx:1.25-alpine
    container_name: samanvay-proxy
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - samanvay-net

  # ----------------------------------------------------------------------------
  # 2. Production Frontend SPA
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: samanvay-frontend
    restart: always
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - samanvay-net

  # ----------------------------------------------------------------------------
  # 3. Production FastAPI Backend Application Server
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: samanvay-backend
    restart: always
    expose:
      - "8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-samanvay_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-samanvay_prod}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://localhost,https://127.0.0.1}
      - DEBUG=false
      - SEED_SYNTHETIC_DATA=false
      - LOG_FORMAT=json
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - BACKGROUND_WORKER_HEARTBEAT_PATH=/app/runtime/worker.heartbeat
      - EVIDENCE_UPLOAD_DIR=/app/storage/evidence
    volumes:
      - evidence_storage:/app/storage/evidence
      - worker_runtime:/app/runtime
      - backups_storage:/app/storage/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - samanvay-net

  # ----------------------------------------------------------------------------
  # 4. Supervised Background Worker & Alert Scheduler
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: samanvay-worker
    entrypoint: ["python", "infrastructure/scripts/worker.py"]
    restart: always
    environment:
      - APP_ENV=production
      - DEBUG=false
      - SEED_SYNTHETIC_DATA=false
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-samanvay_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-samanvay_prod}
      - BACKGROUND_WORKER_HEARTBEAT_PATH=/app/runtime/worker.heartbeat
      - ALERT_SCHEDULER_INTERVAL_SECONDS=${ALERT_SCHEDULER_INTERVAL_SECONDS:-300}
      - FAILED_DELIVERY_RETRY_INTERVAL_SECONDS=${FAILED_DELIVERY_RETRY_INTERVAL_SECONDS:-600}
      - LOG_FORMAT=json
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - worker_runtime:/app/runtime
      - evidence_storage:/app/storage/evidence:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import json, time, os, sys; p='/app/runtime/worker.heartbeat'; sys.exit(0 if (os.path.exists(p) and json.load(open(p)).get('status')=='running' and (time.time() - os.path.getmtime(p) < 900)) else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - samanvay-net

  # ----------------------------------------------------------------------------
  # 5. Hardened PostgreSQL 16 Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: samanvay-postgres-prod
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-samanvay_prod}
      - POSTGRES_USER=${POSTGRES_USER:-samanvay_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-samanvay_user} -d ${POSTGRES_DB:-samanvay_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - samanvay-net

volumes:
  postgres_data:
    name: samanvay_prod_postgres_data
  evidence_storage:
    name: samanvay_prod_evidence_storage
  worker_runtime:
    name: samanvay_prod_worker_runtime
  backups_storage:
    name: samanvay_prod_backups_storage

networks:
  samanvay-net:
    name: samanvay-network
    driver: bridge
