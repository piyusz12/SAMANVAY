user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # High-performance event I/O
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Max upload limit for grievance evidence files (15 Megabytes)
    client_max_body_size 15M;
    client_body_buffer_size 128k;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Structured JSON Access Logging
    log_format json_analytics escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"server_protocol":"$server_protocol",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json_analytics;

    # Rate Limiting Zones (DDoS and brute-force mitigation)
    # Zone 1: General API requests (30 requests/second per IP)
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=30r/s;
    # Zone 2: Sensitive Auth & Login endpoints (5 requests/second per IP)
    limit_req_zone $binary_remote_addr zone=auth_rate_limit:10m rate=5r/s;
    limit_req_status 429;

    # Include site-specific reverse proxy virtual hosts
    include /etc/nginx/conf.d/*.conf;
}
