version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: samanvay-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-samanvay_db}
      POSTGRES_USER: ${POSTGRES_USER:-samanvay_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-samanvay_dev_pass_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-samanvay_user} -d ${POSTGRES_DB:-samanvay_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: samanvay-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@samanvay.aicte.gov.in}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: samanvay_postgres_data
